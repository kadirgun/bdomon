name: Release Build

# Tetikleme: v* etiketleri (örn. v0.1.0) push edildiğinde GitHub Release
# oluşturur; manuel çalıştırmada (workflow_dispatch) sadece artifact yükler.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Windows Release Build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm kurulumu
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # NOT: repoda pnpm-lock.yaml yoksa sürümler kayabilir; ilk build sonrası
      # üretilen lock dosyasını repoya commit etmek build'i tekrarlanabilir yapar.
      - name: Frontend bağımlılıkları
        run: pnpm install

      # beforeBuildCommand (pnpm build) otomatik çalışır; hud.png ve font
      # include_bytes! ile exe'ye gömülür (src-tauri/resources/ repoda olmalı).
      # --no-bundle: MSI/NSIS üretimi atlanır, yalnızca portable exe kalır.
      - name: Tauri release build
        run: pnpm tauri build --no-bundle

      - name: Build çıktıları
        shell: bash
        run: ls -la src-tauri/target/release/*.exe

      - name: Artifact yükle (her çalıştırmada)
        uses: actions/upload-artifact@v4
        with:
          name: bdomon-windows
          if-no-files-found: error
          path: src-tauri/target/release/bdomon.exe

      - name: GitHub Release oluştur (yalnızca v* etiketlerinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BDOMon ${{ github.ref_name }}
          generate_release_notes: true
          files: src-tauri/target/release/bdomon.exe
