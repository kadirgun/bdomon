name: Release Build

# Triggered by pushing v* tags (e.g. v0.1.0), which creates a GitHub Release;
# manual runs (workflow_dispatch) only upload a build artifact.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Windows Release Build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # NOTE: without a committed pnpm-lock.yaml, dependency versions may drift;
      # commit the lock file after the first build to keep builds reproducible.
      - name: Install frontend dependencies
        run: pnpm install

      # beforeBuildCommand (pnpm build) runs automatically; hud.png and the font
      # are embedded into the exe via include_bytes! (src-tauri/resources/ must
      # be committed). --no-bundle skips MSI/NSIS, leaving only the portable exe.
      - name: Tauri release build
        run: pnpm tauri build --no-bundle

      - name: List build output
        shell: bash
        run: ls -la src-tauri/target/release/*.exe

      - name: Upload artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: bdomon-windows
          if-no-files-found: error
          path: src-tauri/target/release/bdomon.exe

      - name: Create GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BDOMon ${{ github.ref_name }}
          generate_release_notes: true
          files: src-tauri/target/release/bdomon.exe
